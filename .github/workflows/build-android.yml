name: Build Vue Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Build Vue project
        run: |
          npx vite build
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Restore jniLibs
        run: |
          # jniLibs is in the repo, but cap sync might overwrite it
          # Restore from backup
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          
          # Check if we need to restore
          if [ ! -f android/app/src/main/jniLibs/arm64-v8a/libpikafish.so ] || \
             [ $(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libpikafish.so 2>/dev/null || echo 0) -lt 1000000 ]; then
            echo "Restoring engine from repo..."
            # The file should be in the repo already
            ls -la android/app/src/main/jniLibs/arm64-v8a/ || true
          fi
          
          echo "jniLibs contents:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          
          # Verify engine size
          ENGINE_SIZE=$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libpikafish.so 2>/dev/null || echo 0)
          echo "Engine size: $ENGINE_SIZE bytes"
          
          if [ "$ENGINE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Engine file is too small or missing!"
            exit 1
          fi
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Verify APK
        run: |
          echo "=== APK Verification ==="
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          
          echo ""
          echo "APK size: $(ls -lh $APK | awk '{print $5}')"
          
          echo ""
          echo "Native libraries:"
          unzip -l $APK | grep "lib/"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-vue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
