name: Build Vue Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Build Vue project
        run: |
          npx vite build
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Download and extract Pikafish engine
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/engine
          
          # Download Pikafish release (52.8 MB, contains engine + NNUE)
          echo "Downloading Pikafish (52.8 MB)..."
          curl -L -o pikafish.7z "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-01-02/Pikafish.2026-01-02.7z"
          
          # Install 7z
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          
          # Extract
          echo "Extracting..."
          7z x pikafish.7z -o./pikafish_extracted -y
          
          echo "Extracted contents:"
          find ./pikafish_extracted -type f -exec ls -lh {} \;
          
          # Copy engine binary (ARM64)
          if [ -f "./pikafish_extracted/pikafish" ]; then
            cp ./pikafish_extracted/pikafish android/app/src/main/jniLibs/arm64-v8a/libpikafish.so
            echo "Copied engine binary"
          elif [ -f "./pikafish_extracted/Linux/pikafish" ]; then
            cp ./pikafish_extracted/Linux/pikafish android/app/src/main/jniLibs/arm64-v8a/libpikafish.so
            echo "Copied engine binary from Linux/"
          else
            echo "ERROR: Engine binary not found!"
            find ./pikafish_extracted -name "pikafish" -type f
            exit 1
          fi
          
          # Copy NNUE model to assets
          if [ -f "./pikafish_extracted/pikafish.nnue" ]; then
            cp ./pikafish_extracted/pikafish.nnue android/app/src/main/assets/engine/
            echo "Copied NNUE model"
          else
            echo "WARNING: NNUE model not found, searching..."
            find ./pikafish_extracted -name "*.nnue" -type f
          fi
          
          echo ""
          echo "Final jniLibs contents:"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          
          echo ""
          echo "Final assets contents:"
          ls -lh android/app/src/main/assets/engine/ || echo "No engine assets"
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Verify APK contents
        run: |
          echo "=== Checking APK contents ==="
          echo ""
          echo "Native libraries:"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep "lib/" || echo "No lib files!"
          echo ""
          echo "Engine assets:"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "engine|nnue" || echo "No engine assets!"
          echo ""
          echo "APK size:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-vue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
