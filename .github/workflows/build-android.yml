name: Build Vue Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Build Vue project
        run: |
          npx vite build
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Download Pikafish engine
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          
          # Download latest Pikafish release
          curl -L -o pikafish_arm64.zip "https://github.com/official-pikafish/Pikafish/releases/download/2026-01-02/pikafish-2026-01-02-arm64.zip"
          curl -L -o pikafish_armv7.zip "https://github.com/official-pikafish/Pikafish/releases/download/2026-01-02/pikafish-2026-01-02-armv7.zip"
          
          unzip -j pikafish_arm64.zip pikafish -d android/app/src/main/jniLibs/arm64-v8a/
          mv android/app/src/main/jniLibs/arm64-v8a/pikafish android/app/src/main/jniLibs/arm64-v8a/libpikafish.so
          
          unzip -j pikafish_armv7.zip pikafish -d android/app/src/main/jniLibs/armeabi-v7a/
          mv android/app/src/main/jniLibs/armeabi-v7a/pikafish android/app/src/main/jniLibs/armeabi-v7a/libpikafish.so
          
          echo "jniLibs contents:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          ls -la android/app/src/main/jniLibs/armeabi-v7a/
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Verify APK contents
        run: |
          echo "Checking APK for .so files:"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep ".so" || echo "No .so files found!"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-vue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
