name: Build Vue Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Build Vue project
        run: |
          npx vite build
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Download and extract Pikafish
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/engine
          
          # Install 7z
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          
          # Download 7z package
          echo "Downloading Pikafish.2026-01-02.7z (52.8 MB)..."
          curl -L -o /tmp/pikafish.7z "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-01-02/Pikafish.2026-01-02.7z"
          
          echo "Downloaded size: $(ls -lh /tmp/pikafish.7z | awk '{print $5}')"
          
          # Extract
          echo "Extracting..."
          7z x /tmp/pikafish.7z -o/tmp/pikafish -y
          
          echo "Extracted files:"
          find /tmp/pikafish -type f -exec ls -lh {} \;
          
          # Find the Linux ARM64 binary
          ENGINE=""
          for f in /tmp/pikafish/pikafish /tmp/pikafish/*/pikafish; do
            if [ -f "$f" ]; then
              SIZE=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
              if [ "$SIZE" -gt 100000 ]; then
                ENGINE="$f"
                echo "Found engine: $f ($SIZE bytes)"
                break
              fi
            fi
          done
          
          if [ -z "$ENGINE" ]; then
            echo "ERROR: No valid engine binary found!"
            exit 1
          fi
          
          # Copy to jniLibs
          cp "$ENGINE" android/app/src/main/jniLibs/arm64-v8a/libpikafish.so
          
          # Copy NNUE if exists
          for f in /tmp/pikafish/*.nnue /tmp/pikafish/*/*.nnue; do
            if [ -f "$f" ]; then
              cp "$f" android/app/src/main/assets/engine/
              echo "Copied NNUE: $f"
            fi
          done
          
          echo ""
          echo "Final jniLibs:"
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          
          echo ""
          echo "Final assets:"
          ls -lh android/app/src/main/assets/engine/ || echo "No engine assets"
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Verify APK
        run: |
          echo "=== APK Verification ==="
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          
          echo ""
          echo "APK size: $(ls -lh $APK | awk '{print $5}')"
          
          echo ""
          echo "Native libraries:"
          unzip -l $APK | grep "lib/"
          
          echo ""
          echo "Engine assets:"
          unzip -l $APK | grep -E "engine|nnue" || echo "None"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-vue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
