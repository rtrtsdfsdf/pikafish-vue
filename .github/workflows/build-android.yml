name: Build Vue Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Build Vue project
        run: |
          npx vite build
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Download and extract Pikafish engine
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          
          # Download Pikafish release (contains both ARM64 and ARMv7)
          curl -L -o pikafish.7z "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-01-02/Pikafish.2026-01-02.7z"
          
          # Install 7z
          sudo apt-get install -y p7zip-full
          
          # Extract
          7z x pikafish.7z -o./pikafish_extracted
          
          echo "Extracted contents:"
          ls -la ./pikafish_extracted/ || ls -la ./
          
          # Find and copy ARM64 binary
          find ./pikafish_extracted -name "*arm64*" -o -name "*aarch64*" | head -5
          
          # Copy binaries (adjust paths based on actual structure)
          if [ -f "./pikafish_extracted/pikafish" ]; then
            cp ./pikafish_extracted/pikafish android/app/src/main/jniLibs/arm64-v8a/libpikafish.so
          fi
          
          # List all files to find correct paths
          find ./pikafish_extracted -type f | head -20
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Verify APK contents
        run: |
          echo "Checking APK for .so files:"
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep ".so" || echo "No .so files found!"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-vue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
