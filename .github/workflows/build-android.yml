name: Build Vue Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Build Vue project
        run: |
          npx vite build
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
      - name: Backup jniLibs
        run: |
          # 备份 jniLibs，因为 cap sync 会删除它
          mkdir -p /tmp/jniLibs_backup
          cp -r android/app/src/main/jniLibs/* /tmp/jniLibs_backup/ 2>/dev/null || true
          echo "Backup contents:"
          ls -la /tmp/jniLibs_backup/arm64-v8a/ || echo "No arm64-v8a backup"
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Restore jniLibs
        run: |
          # 恢复 jniLibs
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp -r /tmp/jniLibs_backup/* android/app/src/main/jniLibs/ 2>/dev/null || true
          
          echo "Restored jniLibs:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          
          # 验证引擎大小
          ENGINE_SIZE=$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libpikafish.so 2>/dev/null || echo 0)
          echo "Engine size: $ENGINE_SIZE bytes"
          
          if [ "$ENGINE_SIZE" -lt 1000000 ]; then
            echo "ERROR: Engine file is too small or missing!"
            exit 1
          fi
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Verify APK
        run: |
          echo "=== APK Verification ==="
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          
          echo ""
          echo "APK size: $(ls -lh $APK | awk '{print $5}')"
          
          echo ""
          echo "Native libraries:"
          unzip -l $APK | grep "lib/"
          
          # 检查 .so 文件大小
          SO_SIZE=$(unzip -l $APK | grep "libpikafish.so" | awk '{print $1}')
          echo ""
          echo "libpikafish.so size in APK: $SO_SIZE bytes"
          
          if [ "$SO_SIZE" -lt 1000000 ]; then
            echo "ERROR: .so file in APK is too small!"
            exit 1
          fi
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-vue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
