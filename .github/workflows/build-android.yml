name: Build Vue Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install
          
      - name: Build Vue project
        run: |
          npx vite build
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save-dev
          
      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android
          
      - name: Download Pikafish engine
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/engine
          
          # Download from previous working release
          echo "Downloading engine binary..."
          curl -L -o /tmp/pikafish "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-01-02/pikafish-bmi2-linux"
          
          # If that fails, try alternative
          if [ ! -f /tmp/pikafish ] || [ ! -s /tmp/pikafish ]; then
            echo "Trying alternative download..."
            # Use the 7z package
            sudo apt-get update && sudo apt-get install -y p7zip-full
            curl -L -o /tmp/pikafish.7z "https://github.com/official-pikafish/Pikafish/releases/download/Pikafish-2026-01-02/Pikafish.2026-01-02.7z"
            7z x /tmp/pikafish.7z -o/tmp/pikafish_extracted -y
            find /tmp/pikafish_extracted -name "pikafish" -type f -exec cp {} /tmp/pikafish \;
          fi
          
          ls -la /tmp/pikafish || echo "Engine not found!"
          
          # Copy to jniLibs
          cp /tmp/pikafish android/app/src/main/jniLibs/arm64-v8a/libpikafish.so
          
          echo "jniLibs contents:"
          ls -la android/app/src/main/jniLibs/arm64-v8a/
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Verify APK contents
        run: |
          echo "=== Checking APK contents ==="
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "lib/|\.so" || echo "No .so files!"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-vue-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
